answers_file: .copier-answers.yml

_exclude:
  - .github/workflows/copier-smoke.yml
  - .python-version
  - pyproject.toml
  - scripts/validate-template.sh
  - tests
  - uv.lock
  - tools

_skip_if_exists:
  - scripts/validate-project.py

_message_after_copy: |
  Project created from the Agentic Delivery Template.

  Install Copier to receive future template updates:

    uv tool install copier
    copier update
