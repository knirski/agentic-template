answers_file: .copier-answers.yml

# A custom _exclude list replaces Copier's built-in safety exclusions, so they
# are re-declared here: VCS metadata, Python bytecode, editor/OS litter, and
# local tool state never ship into generated projects.
_exclude:
  - .DS_Store
  - .direnv
  - .git
  - .hypothesis
  - .pytest_cache
  - .ruff_cache
  - .mypy_cache
  - .coverage
  - .svn
  - .venv
  - "~*"
  - "*.py[co]"
  - __pycache__
  - copier.yaml
  - result
  # The finite template-maintenance artifact set declared by
  # .rygor/source-ownership.json and the cleanup-control inventory
  # itself; generated projects keep every other generated-lifecycle source
  # path.  Seed-once output is materialized by bootstrap from the canonical
  # scaffold blobs that remain in the copied project; Copier's merge and
  # conflict handling therefore never claims the adopter-owned root paths.
  - .rygor/maintenance-artifacts.json
  - .github/workflows/copier-smoke.yml
  - .github/workflows/mutation.yml
  - .github/workflows/pr-agent-commands.yml
  - .github/workflows/pr-agent.yml
  - .github/workflows/semantic-release.yml
  - .github/workflows/template-ci.yml
  - .pr_agent.toml
  - .python-version
  - .releaserc
  # The reusable validation boundary is adopter-owned and seeded by bootstrap;
  # Copier must not claim it during source updates.
  - .github/workflows/project-validation.yml
  # Seed-once adopter output is supplied by bootstrap from the canonical
  # generated-lifecycle scaffold blobs; Copier must not own root paths.
  - /README.md
  - docs/prd.md
  - /SECURITY.md
  - /CONTRIBUTING.md
  - scripts/validate-project
  - docs/specs
  # Bootstrap-managed documentation is rendered transactionally after Copier
  # updates; Copier must not claim ownership of these derived outputs.
  - docs/capabilities.md
  - docs/delivery-workflow.md
  - docs/github-setup.md
  - docs/template-updates.md
  - flake.lock
  - flake.nix
  - pyproject.toml
  - tests
  - uv.lock

_message_after_copy: |
  Project created from the Rygor.

  Install Copier to receive future template updates:

    uv tool install copier
    copier update
