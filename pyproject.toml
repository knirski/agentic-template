[project]
name = "agentic-template"
version = "1.13.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
test = [
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
target-version = "py314"
lint.select = ["E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "ANN", "A", "RUF"]
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"
unused-ignore-comment = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
redundant-cast = "error"
unused-type-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = [
    "scripts/bootstrap",
    "scripts/check_project_readiness.py",
    "scripts/validate_repository.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_bootstrap_foundations.py",
    "tests/test_bootstrap_determinism.py",
    "tests/test_bootstrap_decisions.py",
    "tests/test_script_cores.py",
    "-k",
    "not test_accumulate_preserves_arbitrary_success_order and not test_canonical_json_round_trips_arbitrary_strict_values",
]
