[project]
name = "agentic-template"
version = "1.15.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.1",
]
test = [
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
target-version = "py314"
lint.select = ["E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "ANN", "A", "RUF"]
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.basedpyright]
pythonVersion = "3.14"
include = ["scripts", "tests"]
exclude = [".venv", ".pytest_cache", ".ruff_cache"]
# `basic` is the proportionate mode for this codebase. `recommended` and
# `strict` enable the reportUnknown* and reportUnusedCallResult families,
# which surface ~957 warnings the sources were never written to satisfy (they
# were tuned for `ty`, which lacks that taxonomy). Graduate to `recommended`
# once those warning families are systematically addressed.
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = [
    "scripts/bootstrap",
    "scripts/check_project_readiness.py",
    "scripts/validate_repository.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_bootstrap_foundations.py",
    "tests/test_bootstrap_determinism.py",
    "tests/test_bootstrap_decisions.py",
    "tests/test_script_cores.py",
    "-k",
    "not test_accumulate_preserves_arbitrary_success_order and not test_canonical_json_round_trips_arbitrary_strict_values",
]
