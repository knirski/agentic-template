[project]
name = "agentic-template"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
lint = [
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
test = [
    "hypothesis>=6.165.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py314"
lint.select = ["E4", "E7", "E9", "F"]
include = ["scripts/**/*.py", "pyproject.toml"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test-*.py"]
