name: Nix check

on:
  workflow_call:

jobs:
  nix-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Run flake checks
        run: nix flake check
