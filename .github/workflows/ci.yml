name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-source:
    name: Python 3.14 source checks
    if: github.repository == 'knirski/agentic-template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked source dependencies
        run: uv sync --all-groups --locked
      - name: Run source checks
        run: |
          uv run pytest
          uv run ruff check
          uv run ruff format --check
          uv run ty check

  delivery-contract:
    name: Delivery contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
      - name: Validate generic delivery files
        run: uv run --no-project --python 3.14 scripts/validate_template.py

  project-validation:
    name: Project validation
    runs-on: ubuntu-latest
    env:
      AGENTIC_TEMPLATE_SOURCE_REPOSITORY: knirski/agentic-template
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
      - name: Validate generated-project contract
        if: github.repository != 'knirski/agentic-template'
        run: uv run --no-project --python 3.14 scripts/validate_repository.py
      - name: Validate source fixtures
        if: github.repository == 'knirski/agentic-template'
        run: |
          uv run --no-project --python 3.14 tests/test_project_readiness.py
          uv run --no-project --python 3.14 tests/test_repository_validation.py
          uv run --no-project --python 3.14 tests/test_github_template_readiness.py

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://docker.io/rhysd/actionlint:1.7.7

  release:
    name: Semantic Release
    needs: [python-source, delivery-contract, project-validation, workflow-lint]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/semantic-release.yml
