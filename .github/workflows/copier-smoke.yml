name: Copier Smoke Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  copier:
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked source dependencies
        run: uv sync --all-groups --locked
      - name: Run Copier smoke tests
        run: |
          uv run python tests/test_copier.py
          uv run python tests/test_copier_bootstrap.py
      - name: Stage compiled workflow fixtures for linting
        run: |
          mkdir -p .github/workflows/fixtures
          cp scripts/fixtures/workflows/*.yml .github/workflows/fixtures/
      - name: Run actionlint on source and compiled workflow fixtures
        uses: docker://docker.io/rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
      - name: Remove staged fixture copies
        run: rm -rf .github/workflows/fixtures
